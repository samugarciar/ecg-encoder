# Configuración de adquisición y preprocesamiento de señal ECG (MIT-BIH)
signal:
  fs: 360
  adc_zero: 1024
  adc_gain: 200
  lead: "MLII"

window:
  pre: 90
  post: 166
  length: 256

filter:
  bandpass: [0.5, 40.0]
  order: 3

records:
  excluded: [102, 104, 107, 217]
  ds1_train: [101, 106, 108, 109, 112, 114, 115, 118, 122, 124, 201, 203, 205, 207, 208, 215, 220, 230]
  ds1_val: [116, 119, 209, 223]
  ds2_test: [100, 103, 105, 111, 113, 117, 121, 123, 200, 202, 210, 212, 213, 214, 219, 221, 222, 228, 231, 232, 233, 234]
